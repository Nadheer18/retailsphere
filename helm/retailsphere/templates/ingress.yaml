apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: retailsphere-ingress

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
  - host: {{ .Values.ingress.host }}

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: backend

            port:
              number: 8080
