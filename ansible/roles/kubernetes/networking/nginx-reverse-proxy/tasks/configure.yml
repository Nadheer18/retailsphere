---
- name: Deploy reverse proxy configuration
  template:
    src: ecommerce.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_site_name }}"
    mode: "0644"
  notify: Restart nginx

- name: Enable ecommerce site
  file:
    src: "/etc/nginx/sites-available/{{ nginx_site_name }}"
    dest: "/etc/nginx/sites-enabled/{{ nginx_site_name }}"
    state: link
  notify: Restart nginx

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx

- name: Validate nginx configuration
  command: nginx -t
  changed_when: false

- name: Apply nginx changes
  meta: flush_handlers
