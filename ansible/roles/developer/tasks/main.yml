---
- name: Install developer packages
  apt:
    name: "{{ developer_packages }}"
    state: present
    update_cache: yes

- name: Start Docker
  service:
    name: docker
    state: started
    enabled: yes

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Create developer users
  user:
    name: "{{ item }}"
    state: present
    create_home: yes
    shell: /bin/bash
    groups: sudo,docker
    append: yes
  loop:
    - dev1
    - dev2
